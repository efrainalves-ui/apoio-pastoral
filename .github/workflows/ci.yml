name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Para poder repetir uma corrida sem precisar de um commit vazio.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      # Modo local deixou de ser o que sobra: a build precisa declarar o
      # ambiente, e o CI declara desenvolvimento com dados fictícios.
      VITE_APP_ENV: 'desenvolvimento'
      VITE_DISABLE_SYNC: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm build
      - run: pnpm verify:pwa
      - name: Conferir a configuração de ambiente desta build
        run: pnpm verify:env
      - name: Conferir os cabeçalhos de segurança versionados
        run: pnpm verify:headers
      - name: Revisão de segurança do repositório
        run: pnpm verify:repo

      - name: Auditoria de dependências
        run: pnpm audit --audit-level=low

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Modo local deixou de ser o que sobra: a build precisa declarar o
      # ambiente, e o CI declara desenvolvimento com dados fictícios.
      VITE_APP_ENV: 'desenvolvimento'
      VITE_DISABLE_SYNC: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # Sem `--with-deps`: aquilo dispara um `apt-get` a cada corrida, e o espelho
      # de pacotes do runner falhou duas vezes seguidas com "index files failed
      # to download" — uma dependência de rede que não é nossa e que derruba a
      # verificação inteira. A imagem do Ubuntu do GitHub já traz as bibliotecas
      # que o Chromium precisa; se um dia faltar alguma, o navegador não abre e o
      # teste falha dizendo isso, em vez de falhar antes de começar.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Guardar evidências E2E em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidencias
          # Só o relatório: ele já embute os traces e as capturas, e
          # `test-results` era a mesma evidência em cru. Enviar os dois dobrava
          # cada falha e enchia a franquia de armazenamento da conta.
          path: playwright-report
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 3
