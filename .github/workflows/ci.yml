name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      VITE_DISABLE_SYNC: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm build
      - run: pnpm verify:pwa
      - name: Revisão de segurança do repositório
        run: pnpm verify:repo

  banco:
    name: Migrations, reversão e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres descartável do próprio runner, com autenticação de confiança:
    # não existe senha, segredo ou conexão com Supabase nesta verificação.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Garantir o cliente psql
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version
      - name: Aplicar, provar e reverter a migration
        run: ./scripts/db/test-migrations.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_DISABLE_SYNC: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Guardar evidências E2E em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidencias
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
