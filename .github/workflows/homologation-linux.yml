name: Homologação interna (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verificações e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # A homologação não se conecta a serviços remotos nem usa credenciais.
      VITE_DISABLE_SYNC: 'true'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres

    # Postgres descartável do próprio runner, com autenticação de confiança:
    # não existe senha, segredo ou conexão com Supabase nesta verificação.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar pnpm e Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Instalar dependências limpas
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc -b

      - name: Testes unitários
        run: pnpm exec vitest run --maxWorkers=1

      - name: Build
        run: pnpm build

      - name: Verificação PWA
        run: pnpm verify:pwa
      - name: Conferir os cabeçalhos de segurança versionados
        run: pnpm verify:headers

      - name: Revisão de segurança do repositório
        run: pnpm verify:repo

      - name: Garantir o cliente psql
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Migrations, reversão e isolamento por RLS
        run: ./scripts/db/test-migrations.sh

      - name: Testes E2E Playwright
        run: pnpm test:e2e

      - name: Guardar evidências E2E em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidencias
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
